<svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 48 48">
  <defs>
    <linearGradient id="shaft" x1="100%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%"   stop-color="#1a0d05"/>
      <stop offset="30%"  stop-color="#3d1f0a"/>
      <stop offset="55%"  stop-color="#2a1208"/>
      <stop offset="75%"  stop-color="#4a2510"/>
      <stop offset="100%" stop-color="#1e0e06"/>
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   stop-color="#ffd700"/>
      <stop offset="50%"  stop-color="#b8860b"/>
      <stop offset="100%" stop-color="#ffc200"/>
    </linearGradient>
    <radialGradient id="tipglow" cx="50%" cy="50%" r="50%">
      <stop offset="0%"   stop-color="#ffffff" stop-opacity="1"/>
      <stop offset="40%"  stop-color="#fff4a0" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#ffaa00" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- ── Wand shaft — bottom-right to top-left ── -->
  <line x1="43" y1="44" x2="7" y2="8"
        stroke="url(#shaft)" stroke-width="4.2" stroke-linecap="round"/>
  <!-- Mid highlight streak -->
  <line x1="42" y1="43" x2="8" y2="9"
        stroke="#5a2e12" stroke-width="1.4" stroke-linecap="round" opacity="0.6"/>
  <!-- Edge darkening -->
  <line x1="43.8" y1="44.5" x2="8.5" y2="8.5"
        stroke="#0d0603" stroke-width="1.6" stroke-linecap="round" opacity="0.5"/>

  <!-- ── Knots / bumps along shaft ── -->
  <ellipse cx="35" cy="36" rx="2.8" ry="1.8"
           fill="#2a1008" transform="rotate(45 35 36)" opacity="0.85"/>
  <ellipse cx="28" cy="29" rx="2.4" ry="1.5"
           fill="#3a1a0a" transform="rotate(45 28 29)" opacity="0.7"/>
  <ellipse cx="18" cy="19" rx="2.0" ry="1.3"
           fill="#1e0e06" transform="rotate(45 18 19)" opacity="0.75"/>

  <!-- ── Gold binding rings near handle (bottom-right) ── -->
  <!-- Ring 1 — widest, lowest -->
  <ellipse cx="36.5" cy="37.5" rx="3.2" ry="1.1"
           fill="url(#gold)" transform="rotate(45 36.5 37.5)" opacity="0.95"/>
  <ellipse cx="36.5" cy="37.5" rx="3.2" ry="1.1"
           fill="none" stroke="#7a5000" stroke-width="0.5"
           transform="rotate(45 36.5 37.5)" opacity="0.6"/>
  <!-- Ring 2 -->
  <ellipse cx="33.5" cy="34.5" rx="2.8" ry="1.0"
           fill="url(#gold)" transform="rotate(45 33.5 34.5)" opacity="0.9"/>
  <!-- Ring 3 -->
  <ellipse cx="31" cy="32" rx="2.5" ry="0.85"
           fill="url(#gold)" transform="rotate(45 31 32)" opacity="0.85"/>

  <!-- ── Pommel — gold sphere at bottom-right ── -->
  <circle cx="41.5" cy="43" r="3.4" fill="url(#gold)"/>
  <circle cx="40.8" cy="42.2" r="1.2" fill="#fff3c0" opacity="0.55"/>
  <circle cx="41.5" cy="43" r="3.4" fill="none" stroke="#7a5000" stroke-width="0.6" opacity="0.7"/>

  <!-- ── Tip glow at top-left ── -->
  <circle cx="6" cy="7" r="5" fill="url(#tipglow)" opacity="0.9"/>
  <circle cx="6" cy="7" r="1.6" fill="#ffffff" opacity="0.95"/>

  <!-- ── Sparkle cross at tip ── -->
  <line x1="6" y1="2.5" x2="6" y2="11.5"
        stroke="#fff8c0" stroke-width="0.9" stroke-linecap="round" opacity="0.85"/>
  <line x1="1.5" y1="7" x2="10.5" y2="7"
        stroke="#fff8c0" stroke-width="0.9" stroke-linecap="round" opacity="0.85"/>
  <line x1="2.8" y1="3.8" x2="9.2" y2="10.2"
        stroke="#ffd060" stroke-width="0.6" stroke-linecap="round" opacity="0.65"/>
  <line x1="9.2" y1="3.8" x2="2.8" y2="10.2"
        stroke="#ffd060" stroke-width="0.6" stroke-linecap="round" opacity="0.65"/>
</svg>
